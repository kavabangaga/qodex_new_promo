# QODEX: заявки с формы сайта → приёмник lead_mailer.py на 127.0.0.1:8787 (см. README.md).
#
# Установить в /etc/nginx/snippets/qodex-api-lead.conf и подключить ВНУТРИ блока server { … } сайта qodex.tech
# (того, что отвечает по https, порт 443; и в каждом другом server { }, который отдаёт сайт, например www,
# если он не перенаправляет на qodex.tech):
#
#     include /etc/nginx/snippets/qodex-api-lead.conf;
#
# Зона qodex_lead для limit_req описана в nginx-lead-limit.conf (/etc/nginx/conf.d/qodex-lead-limit.conf).
# Без неё nginx -t сообщит об ошибке и ничего не сломает. Затем: nginx -t && systemctl reload nginx

location = /api/lead {
    # только POST; GET и прочее — 403 от самого nginx
    limit_except POST { deny all; }

    # первый рубеж против потока заявок: с одного адреса 6 запросов подряд, дальше один в 30 секунд (429).
    # Приёмник сам считает ещё строже: 5 заявок за 10 минут с адреса (IPv6 — с сети /64) и общий потолок в час.
    limit_req zone=qodex_lead burst=5 nodelay;
    limit_req_status 429;

    # заявка — несколько сотен байт; больше 16 КБ nginx не примет (413)
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:8787;
    # настоящий адрес посетителя — для ограничения частоты заявок (5 за 10 минут с одного адреса).
    # Заголовок перезаписывается, подделать его из браузера нельзя.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    # Приёмник отвечает после того, как почтовый сервер принял письмо (обычно 1–3 секунды). В худшем случае
    # (почтовый сервер отвечает медленно, но успевает) — до 130 с (SMTP_WORST_CASE в lead_mailer.py). Ждём дольше:
    # иначе посетитель увидит ошибку, хотя письмо ушло, и отправит заявку ещё раз.
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
}
