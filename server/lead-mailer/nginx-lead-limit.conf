# QODEX: зона ограничения частоты для /api/lead (см. nginx-api-lead.conf и README.md, шаг 5).
#
# Этот файл — для контекста http { }. Установить в /etc/nginx/conf.d/qodex-lead-limit.conf:
# в Debian и в пакетах nginx.org файлы /etc/nginx/conf.d/*.conf подключаются внутри http { } (строка
# include /etc/nginx/conf.d/*.conf; в /etc/nginx/nginx.conf). Если такой строки нет — вписать строку ниже
# прямо в http { } файла /etc/nginx/nginx.conf.
#
# 1 МБ памяти — около 16 000 адресов; rate=2r/m — один запрос в 30 секунд (плюс burst=5 в nginx-api-lead.conf).

limit_req_zone $binary_remote_addr zone=qodex_lead:1m rate=2r/m;
