# Публикация на GitHub Pages при каждой отправке в ветку main.
# Сайт — только version4, по адресу /v4/. Прежние версии удалены (2026-10-07): корень и /v2/, /v3/
# перенаправляют на /v4/, чтобы старые ссылки не вели в пустоту; неизвестные адреса — страница 404 из v4.
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: version4/package-lock.json

      - name: Установка зависимостей
        run: npm ci --prefix version4

      - name: Сборка
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${{ github.event.repository.name }}"
          export SITE_URL="https://${OWNER}.github.io"
          # репозиторий вида логин.github.io открывается с корня домена
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/${REPO}/"; fi
          (cd version4 && SITE_BASE="${BASE}v4/" npx astro build --outDir ../_site/v4)

          # корень и адреса прежних версий — переход на /v4/ (с сохранением #якоря)
          TO="${BASE}v4/"
          for dir in _site _site/v2 _site/v3; do
            mkdir -p "$dir"
            cat > "$dir/index.html" <<HTML
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=${TO}">
          <link rel="canonical" href="${TO}">
          <title>QODEX</title>
          <script>location.replace('${TO}' + location.hash);</script>
          </head>
          <body><a href="${TO}">QODEX</a></body>
          </html>
          HTML
          done

          # GitHub Pages показывает 404.html из корня сайта
          cp _site/v4/404.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
