# Публикация на GitHub Pages при каждой отправке в ветку main.
# Главная ссылка — версия на всю ширину (version2_wide), по адресу /v2/ — версия по центру (version 2).
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            version2_wide/package-lock.json
            version 2/package-lock.json

      - name: Установка зависимостей
        run: |
          npm ci --prefix version2_wide
          npm ci --prefix "version 2"

      - name: Сборка обеих версий
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${{ github.event.repository.name }}"
          export SITE_URL="https://${OWNER}.github.io"
          # репозиторий вида логин.github.io открывается с корня домена
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/${REPO}/"; fi
          (cd version2_wide && SITE_BASE="$BASE" npx astro build --outDir ../_site)
          (cd "version 2" && SITE_BASE="${BASE}v2/" npx astro build --outDir ../_site/v2)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
