# Сайт qodex.tech на сервере 82.146.59.244 — новый сайт (Astro, папка version4 репозитория).
#
# Где лежит: /etc/nginx/sites-enabled/qodex.tech — заменяет прежний файл целиком (прежний сайт
# отдавался из /opt/qodex-promo/.output/public, он остаётся на месте для возврата).
# Нужны ещё три файла из этой же папки репозитория:
#   /etc/nginx/conf.d/qodex-site-limits.conf        — зона ограничения частоты заявок (qodex_form);
#   /etc/nginx/snippets/qodex-site-headers.conf     — заголовки безопасности;
#   /etc/nginx/snippets/qodex-site-redirects.conf   — переадресация адресов прежнего сайта.
#
# Как применить (подробно — deploy/README.md, «Переключение qodex.tech на новый сайт»):
#   1. копия прежнего файла — НЕ в sites-enabled (nginx читает оттуда все файлы подряд):
#        sudo install -d -m 755 /etc/nginx/qodex-backup
#        sudo cp -a /etc/nginx/sites-enabled/qodex.tech /etc/nginx/qodex-backup/qodex.tech.$(date +%Y%m%d-%H%M%S)
#   2. положить файлы:  sudo install -m 644 qodex.tech.conf /etc/nginx/sites-enabled/qodex.tech  (и три файла выше)
#   3. проверить:       sudo nginx -t
#   4. применить:       sudo systemctl reload nginx
#      Только reload, никогда restart: reload подхватывает настройки без обрыва соединений, а если
#      в настройках ошибка — nginx продолжает работать на прежних. На сервере живут и другие сайты.
#   Если nginx -t ругается — вернуть копию из /etc/nginx/qodex-backup/ и снова nginx -t.
#
# Строки с пометкой «# managed by Certbot» оставлены дословно: certbot продлевает сертификат
# (qodex.tech и www.qodex.tech, authenticator = nginx) и ищет их по этим пометкам.
# Сайт выкладывает GitHub Actions в /opt/qodex-site/releases/<версия>, current — ссылка на текущую.
# Заявки с формы: POST /api/request → прежний отправщик писем (127.0.0.1:9012) и копия запроса — мост
# в CRM Weeek (server/weeek-bridge, служба qodex-weeek-bridge, 127.0.0.1:9031).

# --- www.qodex.tech → qodex.tech -------------------------------------------------------------------
server {
    server_name www.qodex.tech;
    server_tokens off;
    include /etc/nginx/snippets/qodex-site-headers.conf;

    return 301 https://qodex.tech$request_uri;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qodex.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qodex.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- qodex.tech ------------------------------------------------------------------------------------
server {
    server_name qodex.tech;
    server_tokens off;

    root /opt/qodex-site/current;
    index index.html;
    error_page 404 /404.html;

    # Выкладка переключает сайт заменой ссылки current. Кэш открытых файлов (open_file_cache, если его
    # включат в nginx.conf для всех сайтов) держал бы файлы прежней версии до перепроверки
    # (open_file_cache_valid) — после выкладки посетители какое-то время получали бы старые страницы
    # вперемешку с новыми, а проверка после выкладки видела бы не ту версию. Здесь кэш выключен всегда.
    open_file_cache off;

    # gzip включён в nginx.conf; здесь — какие ещё типы сжимать (text/html сжимается всегда)
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/xml
               text/plain image/x-icon application/manifest+json;

    # Заголовки безопасности. add_header внутри location отменяет все add_header уровня server,
    # поэтому каждый location со своим add_header подключает этот файл заново.
    include /etc/nginx/snippets/qodex-site-headers.conf;

    # Старые адреса прежнего сайта → новые страницы (301). Там только location = …,
    # они проверяются раньше остальных.
    include /etc/nginx/snippets/qodex-site-redirects.conf;

    # Заявки с формы сайта → прежний отправщик писем (FastAPI, служба mail.service, 127.0.0.1:9012):
    # письмо уходит с no-reply@qodex.tech на info@qodex.tech. Только POST: форма отправляет заявку с этого же
    # сайта, предварительного запроса OPTIONS браузер не делает; GET и прочее — 403. Тело до 16 КБ.
    # Частота — зона qodex_form (conf.d/qodex-site-limits.conf): одна заявка в 10 секунд с адреса и запас
    # burst=5 — подряд проходят 6 заявок, седьмая сразу получает 429, дальше запас пополняется по одной
    # за 10 секунд: за первую минуту — около 11 заявок, потом 6 в минуту.
    #
    # Копия каждой заявки — мосту в CRM Weeek (mirror ниже): nginx повторяет тот же POST с тем же телом
    # на /_qodex_weeek, мост создаёт карточку. Отказы до этого места (429, 403, 413 — тело больше 16 КБ)
    # в мост не попадают: mirror срабатывает после проверок. Ответ моста nginx не ждёт и посетителю
    # не показывает: посетитель получает ответ отправщика писем, даже если мост выключен или молчит.
    location = /api/request {
        limit_req zone=qodex_form burst=5 nodelay;
        limit_req_status 429;
        limit_except POST {
            deny all;
        }
        client_max_body_size 16k;
        mirror /_qodex_weeek;
        mirror_request_body on;
        proxy_pass http://127.0.0.1:9012/api/request;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Мост в CRM Weeek (server/weeek-bridge, служба systemd qodex-weeek-bridge, 127.0.0.1:9031): получает
    # копию заявки от mirror выше — POST /lead с тем же JSON. internal — снаружи адрес не открыть (404).
    # Короткие сроки: мост, который не отвечает, не держит соединение посетителя дольше нескольких секунд.
    # set $args "" — без «?…» из адреса заявки: мост принимает ровно /lead.
    location = /_qodex_weeek {
        internal;
        set $args "";
        proxy_pass http://127.0.0.1:9031/lead;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Остальное под /api/ — 404: прячет описание отправщика (/api/docs, /api/openapi.json)
    # и не пускает к нему ботов (/api/auth/…, /api/trpc и т. п.).
    location ^~ /api/ {
        return 404;
    }

    # Скрипты, стили и шрифты сборки: в имени хеш содержимого, файл с тем же именем не меняется — год.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Картинки и видео страниц, логотипы клиентов: имена без хеша, меняются редко — 30 дней.
    location ^~ /media/ {
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location ^~ /clients/ {
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Документы. no-cache — это «сохранить, но каждый раз спросить сервер, не изменилось ли»: на
    # неизменившийся файл nginx отвечает 304 без тела, а заменённый PDF посетитель видит сразу.
    location ^~ /files/ {
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Страница «Не найдено» — только как ответ на неизвестный адрес (с кодом 404), не по прямой ссылке.
    location = /404.html {
        internal;
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Список контрольных сумм выкладки — для сервера, не для посетителей.
    location = /MANIFEST.sha256 {
        return 404;
    }

    # Скрытые файлы (/.env, /.git/… — их ищут боты); /.well-known/ оставлен для служебных файлов.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Страницы и всё остальное: no-cache, чтобы после выкладки посетители сразу видели новую версию.
    # /ro-bot/ → ro-bot/index.html; /ro-bot (без «/») → тот же файл (canonical на странице — с «/»).
    # Без $uri.html: иначе /404 и /index открывали бы 404.html и index.html с кодом 200, а это не страницы.
    location / {
        include /etc/nginx/snippets/qodex-site-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qodex.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qodex.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- http:// → https://qodex.tech (оба имени) --------------------------------------------------------
# Блок как был, с пометками certbot; переадресация теперь сразу на qodex.tech без www.
# Проверку домена certbot при продлении проводит здесь же (сам добавляет правило для /.well-known/acme-challenge/).
# server_tokens и заголовки безопасности — и здесь: без них ответ 301 показывал бы версию nginx.
server {
    server_tokens off;
    include /etc/nginx/snippets/qodex-site-headers.conf;

    if ($host = www.qodex.tech) {
        return 301 https://qodex.tech$request_uri;
    } # managed by Certbot


    if ($host = qodex.tech) {
        return 301 https://qodex.tech$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name qodex.tech www.qodex.tech;
    return 404; # managed by Certbot


}
