# Переадресация адресов прежнего сайта qodex.tech (Nuxt, /opt/qodex-promo) на новый сайт.
#
# Где лежит на сервере: /etc/nginx/snippets/qodex-site-redirects.conf.
# Подключается ВНУТРИ server { … } сайта qodex.tech (порт 443, deploy/nginx/qodex.tech.conf),
# на уровне server, не внутри другого location:
#     include /etc/nginx/snippets/qodex-site-redirects.conf;
#
# Таблица «старый адрес → новый адрес → почему» — deploy/nginx/REDIRECTS.md.
#
# Правила:
# - только точные совпадения (location =). nginx проверяет их первыми, раньше location ^~ /files/
#   и location /, поэтому место подключения в server { } не важно;
# - ни один путь ниже не совпадает с файлом или страницей нового сайта (проверено по сборке
#   version4/dist). Исключение — /documents без косой черты: это папка страницы /documents/,
#   правило для неё сделано намеренно, см. ниже;
# - адрес назначения полный (https://qodex.tech/…), чтобы nginx не подставил в него чужое имя
#   сервера или порт;
# - $is_args$args переносит метки из старой ссылки (?utm_source=… и т. п.). По правилам адреса они
#   стоят перед якорем #…, поэтому записаны до него;
# - прежний сайт открывал страницы и с косой чертой в конце, и без неё, поэтому у каждой страницы
#   два правила.

# --- Страницы прежнего сайта -------------------------------------------------------------------

# «Контакты» → раздел «Заявка» на главной: почта, телефон, Telegram и форма (id="kontakty")
location = /contacts      { return 301 https://qodex.tech/$is_args$args#kontakty; }
location = /contacts/     { return 301 https://qodex.tech/$is_args$args#kontakty; }

# «Проект» — рассказ о системе QODEX TONN и её результатах → страница QODEX TONN
location = /project       { return 301 https://qodex.tech/tonn/$is_args$args; }
location = /project/      { return 301 https://qodex.tech/tonn/$is_args$args; }

# «Gravity» — модуль QODEX TONN на весовой (весы, камеры, шлагбаумы) → страница QODEX TONN
location = /demo-gravity  { return 301 https://qodex.tech/tonn/$is_args$args; }
location = /demo-gravity/ { return 301 https://qodex.tech/tonn/$is_args$args; }

# «Signall» — веб-кабинет QODEX TONN (аналитика, акты, контрагенты, транспорт)
# → раздел «Кабинет. Возможности системы» на странице QODEX TONN (id="kabinet")
location = /demo-signall  { return 301 https://qodex.tech/tonn/$is_args$args#kabinet; }
location = /demo-signall/ { return 301 https://qodex.tech/tonn/$is_args$args#kabinet; }

# Служебные копии главной у Nuxt
location = /_index        { return 301 https://qodex.tech/$is_args$args; }
location = /_index/       { return 301 https://qodex.tech/$is_args$args; }
location = /200.html      { return 301 https://qodex.tech/$is_args$args; }

# Встраиваемый блок «Решения для весовой» (схема оборудования весовой) → тот же блок
# «Как устроена ваша весовая с решениями QODEX» на странице QODEX TONN (id="oborudovanie")
location = /solution-embed.html { return 301 https://qodex.tech/tonn/$is_args$args#oborudovanie; }

# «Документы». Страница есть и в новом сайте, но по адресу /documents/ — с косой чертой
# (он же canonical). Без этого правила исход зависел бы от try_files в описании сайта:
# с «$uri/» nginx сам отвечает 301 на /documents/, а с «$uri/index.html» (как было у прежнего
# сайта) отдаёт страницу и по /documents — у одной страницы два адреса. Этот адрес проверяет
# Минцифры, на него ссылаются другие сайты, поэтому переход на основной адрес задан явно.
# Саму страницу /documents/ правило не задевает: точное совпадение срабатывает только на /documents.
location = /documents     { return 301 https://qodex.tech/documents/$is_args$args; }

# --- Данные страниц Nuxt (_payload.json) -------------------------------------------------------
# Их запрашивал скрипт прежнего сайта, сейчас — поисковые роботы и закэшированные копии страниц.
# Это не страницы, переадресация на HTML сломала бы разбор JSON, поэтому 410: адреса больше нет.
location = /_payload.json              { return 410; }
location = /_index/_payload.json       { return 410; }
location = /contacts/_payload.json     { return 410; }
location = /documents/_payload.json    { return 410; }
location = /project/_payload.json      { return 410; }
location = /demo-gravity/_payload.json { return 410; }
location = /demo-signall/_payload.json { return 410; }

# --- Файлы ---------------------------------------------------------------------------------------
# Документы /files/*.pdf лежат в новом сайте под прежними именами — для них правил нет.
# Ниже только копии, которых в новом сайте нет под этим именем.

# Побайтная копия /files/partners_map.pdf (одинаковые SHA-256). В адресе пробел и скобки — nginx
# сравнивает уже раскодированный путь, так что подходит и %20, и %28/%29.
location = "/files/partners_map (1).pdf" { return 301 https://qodex.tech/files/partners_map.pdf; }

# Побайтная копия /files/system.pdf (презентация «О системе»)
location = /images/system.pdf { return 301 https://qodex.tech/files/system.pdf; }

# Значок прежнего сайта. У нового сайта значки favicon.ico, favicon.svg, apple-touch-icon.png
location = /favicon.png { return 301 https://qodex.tech/favicon.ico; }

# /embed/act.jpg, analytica.jpg, auto.jpg, contragents.jpg — правил нет: картинки перенесены в
# version4/public/embed/ без изменений. Их показывает лендинг tonn.qodex.tech (<img src=
# "https://qodex.tech/embed/…">), переадресация им не нужна.
#
# Остальные файлы оформления прежнего сайта (/_nuxt/, /fonts/, /images/, /videos/) не переносятся
# и отвечают 404: новый сайт их не использует, внешних ссылок на них не нашлось.
