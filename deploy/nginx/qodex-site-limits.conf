# Ограничение частоты заявок с формы сайта qodex.tech.
#
# Где лежит: /etc/nginx/conf.d/qodex-site-limits.conf (nginx.conf подключает conf.d/*.conf внутри http,
# раньше sites-enabled). Используется в location = /api/request файла sites-enabled/qodex.tech
# (deploy/nginx/qodex.tech.conf): limit_req zone=qodex_form burst=5 nodelay.
#
# Применить: sudo install -m 644 qodex-site-limits.conf /etc/nginx/conf.d/qodex-site-limits.conf,
# затем sudo nginx -t и sudo systemctl reload nginx (не restart). Подробно — deploy/README.md.
#
# 6 заявок в минуту с одного адреса (одна в 10 секунд), память зоны 1 МБ — это около 16 тысяч адресов.
# Вместе с burst=5 в location: подряд проходят 6 заявок, седьмая сразу получает 429; запас пополняется
# по одной заявке за 10 секунд — за первую минуту проходит около 11, дальше 6 в минуту.
# Код ответа сверх предела (429) задан внутри location сайта, а не здесь: limit_req_status на уровне http
# поменял бы ответ и другим сайтам этого сервера.
limit_req_zone $binary_remote_addr zone=qodex_form:1m rate=6r/m;
