# Заголовки безопасности сайта qodex.tech.
#
# Где лежит: /etc/nginx/snippets/qodex-site-headers.conf. Подключается в server сайта qodex.tech
# (deploy/nginx/qodex.tech.conf) и заново в каждом location, где есть свой add_header: nginx берёт
# add_header уровня server, только если в location нет ни одного своего.
#
# Применить: sudo install -m 644 qodex-site-headers.conf /etc/nginx/snippets/qodex-site-headers.conf,
# затем sudo nginx -t и sudo systemctl reload nginx (не restart). Подробно — deploy/README.md.
#
# always — заголовки и в ответах с ошибкой (404 и т. п.).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
